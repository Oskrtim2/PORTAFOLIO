<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Segoe UI', Verdana, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset=".6" stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".72" cy=".3" r=".55">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".55"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity=".16"/><stop offset="1" stop-color="#f8fafc" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity=".6"/></filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#bloom)"/>

  <!-- Dos monitores detrás -->
  <g opacity=".5" stroke="#a5b4fc" stroke-opacity=".35" stroke-width="2" fill="#0b1224">
    <rect x="60" y="430" width="250" height="150" rx="10"/>
    <rect x="890" y="440" width="250" height="150" rx="10"/>
  </g>
  <g fill="#6366f1" opacity=".45">
    <rect x="80" y="450" width="100" height="110" rx="4"/><rect x="190" y="450" width="100" height="52" rx="4"/><rect x="190" y="508" width="100" height="52" rx="4"/>
    <rect x="910" y="460" width="210" height="110" rx="4"/>
  </g>
  <path d="M310 505 C 520 600 690 600 890 515" fill="none" stroke="#a5b4fc" stroke-width="3" stroke-dasharray="10 10" opacity=".7"/>

  <!-- HUD -->
  <g filter="url(#sh)">
    <rect x="290" y="80" width="620" height="390" rx="22" fill="#1e293b" fill-opacity=".72" stroke="#f8fafc" stroke-opacity=".22"/>
    <rect x="290" y="80" width="620" height="390" rx="22" fill="url(#glass)"/>
  </g>
  <circle cx="324" cy="112" r="7" fill="#6366f1"/>
  <text x="342" y="118" font-size="18" font-weight="700" fill="#f8fafc">ContextFlow</text>
  <text x="878" y="118" font-size="13" fill="#94a3b8" text-anchor="end">Ctrl + E + F</text>

  <!-- Medidores -->
  <g font-size="13" fill="#cbd5e1" text-anchor="middle">
    <g transform="translate(380 210)">
      <path d="M-46 30 A 56 56 0 1 1 46 30" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
      <path d="M-46 30 A 56 56 0 0 1 30 -47" fill="none" stroke="url(#indigo)" stroke-width="10" stroke-linecap="round"/>
      <text y="8" font-size="22" font-weight="700" fill="#f8fafc">42%</text><text y="58">CPU</text>
    </g>
    <g transform="translate(520 210)">
      <path d="M-46 30 A 56 56 0 1 1 46 30" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
      <path d="M-46 30 A 56 56 0 1 1 54 -12" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
      <text y="8" font-size="22" font-weight="700" fill="#f8fafc">61%</text><text y="58">RAM</text>
    </g>
    <g transform="translate(660 210)">
      <path d="M-46 30 A 56 56 0 1 1 46 30" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
      <path d="M-46 30 A 56 56 0 0 1 -50 -24" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round"/>
      <text y="8" font-size="22" font-weight="700" fill="#f8fafc">18%</text><text y="58">GPU</text>
    </g>
  </g>
  <!-- Línea de actividad -->
  <path d="M740 240 C 770 200 790 250 815 215 S 860 170 880 200" fill="none" stroke="#a5b4fc" stroke-width="3"/>
  <text x="740" y="268" font-size="13" fill="#94a3b8">IA local · ONNX</text>

  <!-- Cápsulas -->
  <g font-size="14" font-weight="600">
    <rect x="320" y="310" width="170" height="44" rx="22" fill="#6366f1"/><text x="405" y="337" text-anchor="middle" fill="#fff">Código</text>
    <rect x="505" y="310" width="170" height="44" rx="22" fill="#334155"/><text x="590" y="337" text-anchor="middle" fill="#e2e8f0">Diseño</text>
    <rect x="690" y="310" width="190" height="44" rx="22" fill="#334155"/><text x="785" y="337" text-anchor="middle" fill="#e2e8f0">Investigación</text>
  </g>
  <g fill="#334155">
    <rect x="320" y="378" width="560" height="14" rx="7"/><rect x="320" y="404" width="420" height="14" rx="7"/><rect x="320" y="430" width="490" height="14" rx="7"/>
  </g>
  <rect x="320" y="378" width="180" height="14" rx="7" fill="#6366f1" opacity=".8"/>

  <!-- Burbuja flotante -->
  <g transform="translate(990 150)">
    <circle r="54" fill="#6366f1" fill-opacity=".35" stroke="#c7d2fe" stroke-opacity=".7" stroke-width="2"/>
    <circle r="34" fill="#6366f1"/>
    <path d="M-14 -4 h28 M-14 8 h18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="-10" cy="-30" rx="22" ry="9" fill="#fff" opacity=".25"/>
  </g>

  <text x="600" y="640" text-anchor="middle" font-size="30" font-weight="700" fill="#f8fafc" letter-spacing="1">Context<tspan fill="#a5b4fc">Flow</tspan></text>
</svg>
