<!DOCTYPE html>

<!-- ============ ARRANQUE ============ -->
<div id="boot" class="boot" aria-hidden="true">
  <div class="boot-logo">
    <span class="boot-orb"><svg><use href="#i-win"/></svg></span>
  </div>
  <p class="boot-text">Iniciando OskrOS</p>
  <p class="boot-copy">Haz clic para saltar</p>
</div>

<div id="welcome" class="welcome" aria-hidden="true">
  <div class="welcome-frame"><img src="assets/images/hero-avatar.jpg" alt=""></div>
  <p class="welcome-text">Bienvenido</p>
</div>

<!-- ============ ESCRITORIO ============ -->
<main id="desktop" class="desktop">
  <div class="wallpaper" aria-hidden="true">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="hill h1"></div>
    <div class="hill h2"></div>
    <div class="sparkles"></div>
  </div>
  <div id="bubbles" class="bubbles"></div>

  <!-- Iconos del escritorio -->
  <nav class="icons" aria-label="Iconos del escritorio">
    <button class="icon" data-open="about"><svg><use href="#i-user"/></svg><span>Sobre mí</span></button>
    <button class="icon" data-open="projects"><svg><use href="#i-folder"/></svg><span>Proyectos</span></button>
    <button class="icon" data-open="skills"><svg><use href="#i-skills"/></svg><span>Habilidades</span></button>
    <button class="icon" data-open="tattoo"><svg><use href="#i-tattoo"/></svg><span>Tatuajes</span></button>
    <button class="icon" data-open="community"><svg><use href="#i-community"/></svg><span>Comunidad</span></button>
    <button class="icon" data-open="drawings"><svg><use href="#i-photos"/></svg><span>Dibujos</span></button>
    <button class="icon" data-open="paint"><svg><use href="#i-paint"/></svg><span>Paint</span></button>
    <button class="icon" data-open="hobbies"><svg><use href="#i-games"/></svg><span>Hobbies</span></button>
    <button class="icon" data-open="contact"><svg><use href="#i-mail"/></svg><span>Contacto</span></button>
    <button class="icon" data-open="bin"><svg><use href="#i-bin"/></svg><span>Papelera</span></button>
  </nav>

  <!-- Gadgets -->
  <aside class="gadgets" aria-label="Gadgets">
    <div class="gadget clock-gadget">
      <svg viewBox="0 0 100 100" class="analog">
        <defs>
          <radialGradient id="g-face" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfe3f5"/></radialGradient>
        </defs>
        <circle cx="50" cy="50" r="46" fill="url(#g-face)" stroke="#9fb7cf" stroke-width="3"/>
        <g id="ticks"></g>
        <line id="hand-h" x1="50" y1="50" x2="50" y2="28" stroke="#1d2b3a" stroke-width="4" stroke-linecap="round"/>
        <line id="hand-m" x1="50" y1="50" x2="50" y2="17" stroke="#1d2b3a" stroke-width="2.6" stroke-linecap="round"/>
        <line id="hand-s" x1="50" y1="56" x2="50" y2="14" stroke="#e0362a" stroke-width="1.2" stroke-linecap="round"/>
        <circle cx="50" cy="50" r="3" fill="#e0362a"/>
        <ellipse cx="44" cy="26" rx="30" ry="16" fill="#fff" opacity=".35"/>
      </svg>
    </div>
    <div class="gadget stats-gadget">
      <h3>Estado</h3>
      <div class="stat"><span>Tatuando</span><b data-since="tattoo">~9 meses</b></div>
      <div class="stat"><span>Batería</span><b>6–7 años</b></div>
      <div class="stat"><span>Burbujas</span><b id="bubble-count">0</b></div>
    </div>
  </aside>

  <div id="windows"></div>
</main>

<!-- ============ MENÚ INICIO ============ -->
<div id="start-menu" class="start-menu" role="menu" aria-hidden="true">
  <div class="sm-left">
    <button class="sm-item" data-open="about"><svg><use href="#i-user"/></svg><div><b>Sobre mí</b><small>Quién soy</small></div></button>
    <button class="sm-item" data-open="projects"><svg><use href="#i-folder"/></svg><div><b>Proyectos</b><small>Software que he construido</small></div></button>
    <button class="sm-item" data-open="community"><svg><use href="#i-community"/></svg><div><b>Comunidad</b><small>Dibujos de los visitantes</small></div></button>
    <button class="sm-item" data-open="paint"><svg><use href="#i-paint"/></svg><div><b>Paint</b><small>Dibuja algo</small></div></button>
    <button class="sm-item" data-open="tattoo"><svg><use href="#i-tattoo"/></svg><div><b>Tatuajes</b><small>Mi lado tatuador</small></div></button>
    <button class="sm-item" data-open="drawings"><svg><use href="#i-photos"/></svg><div><b>Dibujos</b><small>Mis ilustraciones</small></div></button>
    <div class="sm-sep"></div>
    <button class="sm-item small" data-open="skills"><svg><use href="#i-skills"/></svg><div><b>Habilidades</b></div></button>
    <button class="sm-item small" data-open="hobbies"><svg><use href="#i-games"/></svg><div><b>Hobbies</b></div></button>
    <div class="sm-search"><input id="sm-search" type="search" placeholder="Buscar programas y archivos" aria-label="Buscar"></div>
  </div>
  <div class="sm-right">
    <div class="sm-avatar"><img src="assets/images/hero-avatar.jpg" alt="Avatar de Oscar"></div>
    <button class="sm-link" data-open="about">Oscar Timaran</button>
    <button class="sm-link" data-open="projects">Documentos</button>
    <button class="sm-link" data-open="drawings">Imágenes</button>
    <button class="sm-link" data-open="community">Comunidad</button>
    <button class="sm-link" data-open="hobbies">Juegos</button>
    <a class="sm-link" href="https://github.com/Oskrtim2" target="_blank" rel="noopener">GitHub</a>
    <a class="sm-link" href="https://www.instagram.com/0skrtm__/" target="_blank" rel="noopener">Instagram</a>
    <button class="sm-link" data-open="contact">Contacto</button>
    <button class="sm-shutdown" id="shutdown"><svg><use href="#i-power"/></svg> Apagar</button>
  </div>
</div>

<!-- ============ BARRA DE TAREAS ============ -->
<footer class="taskbar">
  <button id="start-btn" class="start-orb" aria-label="Inicio" aria-haspopup="menu"><svg><use href="#i-win"/></svg></button>
  <div class="tb-pinned">
    <button class="tb-btn pinned" data-open="projects" title="Proyectos"><svg><use href="#i-folder"/></svg></button>
    <button class="tb-btn pinned" data-open="paint" title="Paint"><svg><use href="#i-paint"/></svg></button>
    <a class="tb-btn pinned" href="https://github.com/Oskrtim2" target="_blank" rel="noopener" title="GitHub"><svg><use href="#i-github"/></svg></a>
    <a class="tb-btn pinned" href="https://www.instagram.com/0skrtm__/" target="_blank" rel="noopener" title="Instagram @0skrtm__" aria-label="Instagram"><svg><use href="#i-instagram"/></svg></a>
  </div>
  <div id="tb-windows" class="tb-windows"></div>
  <div class="tray">
    <button id="sound-btn" class="tray-btn" title="Sonido activado" aria-label="Sonido"><svg><use href="#i-speaker"/></svg></button>
    <div class="tray-clock" id="tray-clock"><span id="tb-time">--:--</span><span id="tb-date">--/--/----</span></div>
    <button id="show-desktop" class="show-desktop" title="Mostrar escritorio" aria-label="Mostrar escritorio"></button>
  </div>
</footer>

<!-- Pantalla de apagado -->
<div id="shutdown-screen" class="shutdown-screen" aria-hidden="true">
  <p>Cerrando sesión...</p>
  <button id="power-on" class="aero-btn">Encender de nuevo</button>
</div>

<!-- Visor de fotos a pantalla completa -->
<div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Visor de fotos" hidden>
  <div class="vw-top">
    <svg><use href="#i-photos"/></svg>
    <span class="vw-title"></span>
    <span class="vw-count"></span>
    <button class="vw-close" aria-label="Cerrar visor">&#10005;</button>
  </div>
  <div class="vw-stage"><img class="vw-img" alt="" draggable="false"></div>
  <div class="vw-bar">
    <button class="vw-btn vw-prev" aria-label="Anterior">&#9664;</button>
    <button class="vw-btn vw-zoom big" aria-label="Ampliar">+</button>
    <button class="vw-btn vw-next" aria-label="Siguiente">&#9654;</button>
  </div>
  <p class="vw-help">Clic en la imagen para ampliar · arrastra para moverte · ← → para cambiar · Esc para cerrar</p>
</div>

<!-- ============ PLANTILLAS DE VENTANAS ============ -->
<template id="tpl-about">
  <div class="about">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="general">General</button>
      <button class="tab" data-tab="arte">Arte</button>
      <button class="tab" data-tab="musica">Música</button>
    </div>
    <div class="tab-panel active" data-panel="general">
      <div class="about-head">
        <div class="photo-frame"><img src="assets/images/hero-avatar.jpg" alt="Avatar de Oscar Timaran"></div>
        <div>
          <h1>Oscar Timaran</h1>
          <p class="roles"><span class="pill blue">Ingeniero de Software</span><span class="pill red">Tatuador</span><span class="pill purple">Baterista</span></p>
          <p class="muted">Remoto · LatAm</p>
          <a class="aero-btn ig-btn" href="https://www.instagram.com/0skrtm__/" target="_blank" rel="noopener"><svg width="18" height="18"><use href="#i-instagram"/></svg> Sígueme en Instagram</a>
