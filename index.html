<!-- ============ ARRANQUE ============ -->
<div id="boot" class="boot" aria-hidden="true">
  <div class="boot-logo">
    <span class="boot-orb"><svg><use href="#i-win"/></svg></span>
  </div>
  <p class="boot-text">Iniciando OskrOS</p>
  <p class="boot-copy">Haz clic para saltar</p>
</div>

<div id="welcome" class="welcome" aria-hidden="true">
  <div class="welcome-frame"><img src="assets/images/hero-avatar.jpg" alt=""></div>
  <p class="welcome-text">Bienvenido</p>
</div>
